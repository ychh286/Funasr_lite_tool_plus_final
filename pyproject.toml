[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funasr-lite"
version = "0.5.0"
description = "Local transcription tool based on FunASR (CLI + WebUI + desktop GUI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "funasr>=1.0.0",
  "gradio>=4.0.0",
  "huggingface_hub>=0.30.0",
  "modelscope>=1.20.0",
  # Optional but recommended for process memory (RSS) observability:
  "psutil>=5.9.0",
  "soundfile>=0.13.0",
]

[project.scripts]
funasr-lite = "funasr_lite.cli:main"
funasr-lite-web = "funasr_lite.webui_workbench:main"
funasr-lite-web-legacy = "funasr_lite.webui:main"
funasr-lite-gui = "funasr_lite.gui_entry:main"

[project.optional-dependencies]
gui = [
  "PySide6>=6.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
